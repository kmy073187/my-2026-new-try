<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
    body { background:#1a1a2e; color:#fff; font-family:sans-serif;
        text-align:center; margin-top:30px; }
    canvas { background:#16213e; border:4px solid #0f3460; border-radius:8px; }
    #score { font-size:24px; margin:10px; }
</style>
 </head>
<body>
<h1>🐍 贪吃蛇</h1>
<div id="score">得分: 0</div>
<canvas id="board" width="400" height="400"></canvas>
<p>按方向键开始 · 撞墙或撞自己结束 · 按空格重新开始</p>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const G = 20;
let snake, dir, food, score, timer, dead;

function start() {
    snake =[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    score = 0; dead = false;
    placeFood();
    document.getElementById('score').textContent = '得分: 0';
    clearInterval(timer);
    timer = setInterval(step,150);
}

function placeFood() {

    do {
        food = {x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
    if (dead) return;
    const head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
    if (head.x < 0 || head.x >= G || head.y < 0 || head.y >= G) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score++; 
        document.getElementById('score').textContent = '得分: ' + score;
        placeFood();
    } else {
        snake.pop();
    }
    draw();
}

function gameOver() {
    dead = true;
    clearInterval(timer);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sams-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束！得分 ' + score, 200, 190);
    ctx.font = '16px sans-serif';
    ctx.fillText('按空格重新开始', 200, 220);
}

function draw() {
    ctx.clearRect(0,0,400,400);
    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x*G+2, food.y*G+2, G-4, G-4);
    snake.forEach((s,i) => {
        ctx.fillStyle = i === 0 ? '#4ecca3' : '#2e9e78';
        ctx.fillRect(s.x*G+1, s.y*G+1, G-2, G-2);
    });
}

document.addEventListener('keydown', e => {
    if (e.code === 'Space') { start(); return; }
    if (e.code === 'ArrowUp' && dir.y !== 1) dir = {x:0,y:-1};
    else if (e.code === 'ArrowDown' && dir.y !== -1) dir = {x:0,y:1};
    else if (e.code === 'ArrowLeft' && dir.x !== 1) dir = {x:-1,y:0};
    else if (e.code === 'ArrowRight' && dir.x !== -1) dir = {x:1,y:0};
});
start();
</script>
</body>
</html>
